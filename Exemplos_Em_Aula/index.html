<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão HTML e CSS</title>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        p {
            font-size: 20px;
        }

        .classe {
            color: red;
        }

        #nome {
            color: green;
        }
    </style>
</head>

<body>
    <p>Esse é um parágrafo</p>
    <h1>Título nível 1</h1>
    <h6>Título Nível 6</h6>
    <ol>
        <li class="classe">Posição 1</li>
        <li class="classe">Posição 2</li>
        <li>Posição 3</li>
    </ol>
    <ul>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
    </ul>
    <a href="https://www.google.com">Link para o google</a>
    <img src="imagem.png" alt="Imagem Teste">
    <nav>
        <ul>
            <li>Item Navegação</li>
        </ul>
    </nav>
    <main>
        <p>Texto</p>
    </main>
    <div>
        <p>Texto</p>
        <p>Texo + <span>Texto</span></p>
    </div>
    <table>
        <thead>
            <tr>
                <th>Coluna 1</th>
                <th>Coluna 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Dado 1</td>
                <td>Dado 2</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Rodapé</td>
            </tr>
        </tfoot>
    </table>
    <form action="" method="">
        <label for="nome">Informe o nome:</label>
        <input type="text" id="nome" name="nome"><br>
        <label for="desc">Descrição:</label>
        <textarea name="desc" id="desc"></textarea><br>
        <label for="opt">Opção:</label>
        <select name="opt" id="opt">
            <option value="1">Valor 1</option>
            <option value="2">Valor 2</option>
            <option value="3">Valor 3</option>
        </select><br>
        <button type="submit">Enviar</button>
    </form>
</body>

</html>
