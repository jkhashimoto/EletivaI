<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário 3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <main class="container py-5">

    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="text-center h3 mb-4">Sample Form</h1>
        <form>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Partner Name</label><input type="text" class="form-control">
            </div>
            <div class="col-md-6"><label class="form-label">Partner Email ID</label><input type="email"
                class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Partner Legal Name</label><input type="text"
                class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Partner Mobile</label><input type="tel"
                class="form-control"></div>
            <div class="col-12"><label class="form-label">Partner Address</label><textarea class="form-control"
                rows="2"></textarea></div>
            <div class="col-md-6"><label class="form-label">Contract Start Date</label><input type="date"
                class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Contract Expiry Date</label><input type="date"
                class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Minimum Loan Amount</label><input type="number" step="any"
                class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Maximum Loan Amount</label><input type="number" step="any"
                class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Interest Rate</label><input type="number" step="any"
                class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Deposit Amount</label><input type="number" step="any"
                class="form-control"></div>
          </div>
          <div class="text-center mt-4"><button type="submit" class="btn btn-primary">Save</button></div>
        </form>
      </div>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
