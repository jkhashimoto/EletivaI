<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <main class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
      <div class="card-body bg-body-tertiary">
        <h1 class="h4 mb-4">Billing address</h1>
        <form>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">First name</label><input type="text" class="form-control">
            </div>
            <div class="col-md-6"><label class="form-label">Last name</label><input type="text" class="form-control">
            </div>
            <div class="col-12"><label class="form-label">Username</label>
              <div class="input-group"><span class="input-group-text">@</span><input type="text" class="form-control"
                  placeholder="Username"></div>
            </div>
            <div class="col-12"><label class="form-label">Email (Optional)</label><input type="email"
                class="form-control" placeholder="you@example.com"></div>
            <div class="col-12"><label class="form-label">Address</label><input type="text" class="form-control"
                placeholder="1234 Main St"></div>
            <div class="col-12"><label class="form-label">Address 2 (Optional)</label><input type="text"
                class="form-control" placeholder="Apartment or suite"></div>
            <div class="col-md-5"><label class="form-label">Country</label><select class="form-select">
                <option selected>Choose...</option>
                <option>Brasil</option>
                <option>United States</option>
              </select></div>
            <div class="col-md-4"><label class="form-label">State</label><select class="form-select">
                <option selected>Choose...</option>
                <option>SP</option>
                <option>PR</option>
                <option>RJ</option>
              </select></div>
            <div class="col-md-3"><label class="form-label">Zip</label><input type="text" class="form-control"></div>
          </div>
          <button type="submit" class="btn btn-primary mt-4">Continue</button>
        </form>
      </div>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
