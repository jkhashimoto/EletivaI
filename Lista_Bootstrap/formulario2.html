<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <main class="container py-5">

    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h3 mb-4">Cadastro de Cliente</h1>
        <form>
          <div class="row g-3">
            <div class="col-md-1"><label class="form-label">Código</label><input type="text" class="form-control"
                readonly></div>
            <div class="col-md-5"><label class="form-label">Nome</label><input type="text" class="form-control"
                placeholder="Nome Completo do Cliente"></div>
            <div class="col-md-4"><label class="form-label">E-mail</label><input type="email" class="form-control"
                placeholder="cliente@dominio.com"></div>
            <div class="col-md-2"><label class="form-label">CPF</label><input type="text" class="form-control"
                placeholder="Só números"></div>
            <div class="col-md-2"><label class="form-label">Nº Celular</label><input type="tel" class="form-control"
                placeholder="Nº do celular"></div>
            <div class="col-md-2"><label class="form-label">Nº Telefone fixo</label><input type="tel"
                class="form-control" placeholder="Nº telefone"></div>
            <div class="col-md-2"><label class="form-label">CEP</label><input type="text" class="form-control"
                placeholder="88308070"></div>
            <div class="col-md-2"><label class="form-label">Logradouro</label><input type="text" class="form-control"
                placeholder="Rua 1400,"></div>
            <div class="col-md-1"><label class="form-label">Nº</label><input type="text" class="form-control"
                placeholder="Nº"></div>
            <div class="col-md-3"><label class="form-label">Bairro</label><input type="text" class="form-control"
                placeholder="Bairro"></div>
            <div class="col-md-3"><label class="form-label">Cidade</label><input type="text" class="form-control"
                placeholder="Cidade"></div>
            <div class="col-md-1"><label class="form-label">UF</label><input type="text" class="form-control"
                placeholder="UF"></div>
            <div class="col-md-2"><label class="form-label">Status</label><select class="form-select">
                <option selected>Selecione</option>
                <option>Ativo</option>
                <option>Inativo</option>
              </select></div>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="reset" class="btn btn-danger">Resetar</button>
            <button type="button" class="btn btn-success">Próximo</button>
          </div>
        </form>
      </div>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
