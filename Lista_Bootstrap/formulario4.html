<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário 4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <main class="container py-5">

    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h3 mb-4">Novo Usuário</h1>
        <form>
          <div class="row g-3">
            <div class="col-12"><label class="form-label">Nome</label><input type="text" class="form-control"
                placeholder="Informe o nome"></div>
            <div class="col-md-3"><label class="form-label">CPF</label><input type="text" class="form-control"
                placeholder="Informe o cpf"></div>
            <div class="col-md-6"><label class="form-label">Endereço</label><input type="text" class="form-control"
                placeholder="Informe o endereço"></div>
            <div class="col-md-3"><label class="form-label">Nível</label><select class="form-select">
                <option selected>---</option>
                <option>Administrador</option>
                <option>Usuário</option>
              </select></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control"
                placeholder="Informe o email"></div>
            <div class="col-md-3"><label class="form-label">Senha</label><input type="password" class="form-control"
                placeholder="Informe a senha"></div>
            <div class="col-md-3"><label class="form-label">Status</label><select class="form-select">
                <option selected>---</option>
                <option>Ativo</option>
                <option>Inativo</option>
              </select></div>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4"><button type="submit"
              class="btn btn-success">Enviar</button><button type="reset"
              class="btn btn-outline-secondary">Cancelar</button></div>
        </form>
      </div>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
