<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <main class="container py-5">

    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h3 mb-4">Formulário 1</h1>
        <form>
          <div class="row g-3">
            <div class="col-md-4"><label class="form-label">First name</label><input type="text" class="form-control"
                placeholder="Mark"></div>
            <div class="col-md-4"><label class="form-label">Last name</label><input type="text" class="form-control"
                placeholder="Otto"></div>
            <div class="col-md-4"><label class="form-label">Username</label>
              <div class="input-group"><span class="input-group-text">@</span><input type="text" class="form-control"
                  placeholder="Username"></div>
            </div>
            <div class="col-md-6"><label class="form-label">City</label><input type="text" class="form-control"
                placeholder="City"></div>
            <div class="col-md-3"><label class="form-label">State</label><input type="text" class="form-control"
                placeholder="State"></div>
            <div class="col-md-3"><label class="form-label">Zip</label><input type="text" class="form-control"
                placeholder="Zip"></div>
          </div>
          <div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="terms"><label
              class="form-check-label" for="terms">Agree to terms and conditions</label></div>
          <button type="submit" class="btn btn-primary mt-3">Submit form</button>
        </form>
      </div>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
